<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" font-family="Arial, sans-serif">
  <rect width="900" height="620" fill="#ffffff"/>
  <text x="450" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Room Deterrent: Wiring Diagram</text>

  <!-- Arduino Uno -->
  <rect x="60" y="90" width="260" height="180" rx="8" fill="#1b6ec2" stroke="#0d3a6b" stroke-width="2"/>
  <text x="190" y="115" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">Arduino Uno</text>
  <rect x="90" y="130" width="40" height="24" fill="#0d3a6b"/>
  <text x="110" y="146" font-size="9" text-anchor="middle" fill="#fff">USB</text>

  <!-- Arduino pin labels (right side, digital) -->
  <circle cx="320" cy="150" r="5" fill="#ffd400"/>
  <text x="332" y="154" font-size="12" fill="#1a1a1a">D12 (Trig)</text>
  <circle cx="320" cy="175" r="5" fill="#ffd400"/>
  <text x="332" y="179" font-size="12" fill="#1a1a1a">D10 (Echo)</text>
  <circle cx="320" cy="200" r="5" fill="#ffd400"/>
  <text x="332" y="204" font-size="12" fill="#1a1a1a">D6  (Buzzer +)</text>

  <!-- Arduino power pins (bottom) -->
  <circle cx="120" cy="270" r="5" fill="#e63946"/>
  <text x="105" y="292" font-size="12" text-anchor="middle" fill="#1a1a1a">5V</text>
  <circle cx="160" cy="270" r="5" fill="#333333"/>
  <text x="160" y="292" font-size="12" text-anchor="middle" fill="#1a1a1a">GND</text>

  <!-- Breadboard -->
  <rect x="500" y="80" width="330" height="220" rx="6" fill="#f2e9d8" stroke="#a8926b" stroke-width="2"/>
  <text x="665" y="105" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Breadboard</text>
  <!-- power rails -->
  <line x1="515" y1="120" x2="815" y2="120" stroke="#e63946" stroke-width="2"/>
  <text x="500" y="123" font-size="10" fill="#e63946" text-anchor="end">+</text>
  <line x1="515" y1="135" x2="815" y2="135" stroke="#333333" stroke-width="2"/>
  <text x="500" y="138" font-size="10" fill="#333333" text-anchor="end">-</text>

  <!-- HC-SR04 module -->
  <rect x="540" y="160" width="120" height="60" rx="4" fill="#2a9d8f" stroke="#1b6b61" stroke-width="2"/>
  <text x="600" y="180" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">HC-SR04</text>
  <text x="600" y="195" font-size="10" text-anchor="middle" fill="#fff">Ultrasonic Sensor</text>
  <circle cx="550" cy="230" r="3" fill="#e63946"/>
  <text x="550" y="248" font-size="9" text-anchor="middle">VCC</text>
  <circle cx="570" cy="230" r="3" fill="#333"/>
  <text x="570" y="248" font-size="9" text-anchor="middle">GND</text>
  <circle cx="590" cy="230" r="3" fill="#ffd400"/>
  <text x="592" y="248" font-size="9" text-anchor="middle">Trig</text>
  <circle cx="610" cy="230" r="3" fill="#ffd400"/>
  <text x="613" y="248" font-size="9" text-anchor="middle">Echo</text>

  <!-- Buzzer -->
  <circle cx="740" cy="190" r="35" fill="#e76f51" stroke="#b3491f" stroke-width="2"/>
  <text x="740" y="194" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">Buzzer</text>
  <circle cx="722" cy="230" r="3" fill="#ffd400"/>
  <text x="722" y="248" font-size="9" text-anchor="middle">+</text>
  <circle cx="758" cy="230" r="3" fill="#333"/>
  <text x="758" y="248" font-size="9" text-anchor="middle">-</text>

  <!-- Wires -->
  <!-- Arduino D9 -> Trig -->
  <path d="M320,150 C420,150 420,230 590,230" fill="none" stroke="#ffb703" stroke-width="2"/>
  <!-- Arduino D10 -> Echo -->
  <path d="M320,175 C440,175 440,230 610,230" fill="none" stroke="#fb8500" stroke-width="2"/>
  <!-- Arduino D8 -> Buzzer + -->
  <path d="M320,200 C500,200 500,230 722,230" fill="none" stroke="#219ebc" stroke-width="2"/>
  <!-- 5V -> rail -->
  <path d="M120,270 C120,330 500,330 515,120" fill="none" stroke="#e63946" stroke-width="2"/>
  <!-- GND -> rail -->
  <path d="M160,270 C160,350 515,350 515,135" fill="none" stroke="#333333" stroke-width="2"/>
  <!-- rail -> VCC sensor -->
  <line x1="550" y1="230" x2="550" y2="120" stroke="#e63946" stroke-width="1.5" stroke-dasharray="3,3"/>
  <!-- rail -> GND sensor -->
  <line x1="570" y1="230" x2="570" y2="135" stroke="#333333" stroke-width="1.5" stroke-dasharray="3,3"/>
  <!-- rail -> GND buzzer -->
  <line x1="758" y1="230" x2="758" y2="135" stroke="#333333" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Legend -->
  <rect x="60" y="340" width="770" height="120" rx="6" fill="#f7f7f7" stroke="#cccccc"/>
  <text x="80" y="365" font-size="13" font-weight="bold" fill="#1a1a1a">Connections</text>
  <text x="80" y="388" font-size="12" fill="#1a1a1a">Arduino D12 → HC-SR04 Trig</text>
  <text x="80" y="408" font-size="12" fill="#1a1a1a">Arduino D10 → HC-SR04 Echo</text>
  <text x="80" y="428" font-size="12" fill="#1a1a1a">Arduino D6  → Buzzer (+)</text>
  <text x="450" y="388" font-size="12" fill="#1a1a1a">Arduino 5V  → Breadboard (+) rail → HC-SR04 VCC</text>
  <text x="450" y="408" font-size="12" fill="#1a1a1a">Arduino GND → Breadboard (-) rail → HC-SR04 GND, Buzzer (-)</text>
</svg>
